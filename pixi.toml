[workspace]
channels = ["conda-forge"]
name = "FANS"
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]
preview = ["pixi-build"]

[dependencies]
fans = { path = "." }

[feature.dashboard.dependencies]
python = ">=3.14.7,<3.15"
pytest = ">=9.1.1,<10"
pre-commit = ">=4.6.2,<5"
identify = ">=2.6.19,<3"
git = ">=2.55.0,<3"
ipykernel = ">=7.3.0,<8"
time = ">=1.10,<2"
MSUtils = ">=0.1.2,<0.2"

[feature.dashboard.tasks]
pytest = "pytest -v -s"
precommit = "pre-commit run --all-files"

[feature.dashboard.tasks.h52xdmf]
args = ["file", { arg = "extra", default = "" }]
cmd  = "cd \"$INIT_CWD\" && python -m MSUtils.general.h52xdmf {{ extra }} {{ file }}"

[feature.dev.dependencies]
cmake = ">=4.4.3,<5"
clangxx = ">=23.1.1,<24"
openmpi-mpicxx = ">=5.0.10,<6"
hdf5 = { version = ">=2.2.0,<3", build = "mpi_openmpi_*" }
fftw = { version = ">=3.3.11,<4", build = "mpi_openmpi_*" }
eigen = ">=5.0.1,<6"
nlohmann_json = ">=3.12.0,<4"
spdlog = ">=1.17.0,<2"
time = ">=1.10,<2"

# For pyfans
python = ">=3.14.7,<3.15"
pip = ">=26.2.1,<27"
nanobind = ">=3.1.0,<4"
scikit-build-core = ">=1.0.3,<2"
numpy = ">=2.5.3,<3"
mpi4py = ">=4.1.2,<5"

[feature.native.tasks]
build-fans = "cmake -S . -B build -DFANS_ENABLE_NATIVE=ON && cmake --build build -j"

[feature.neml2]
platforms = ["linux-64", "osx-arm64"]

[feature.neml2.pypi-dependencies]
neml2 = ">=3.1.0, <4"
# CPU-only; torch 2.13+ breaks NEML2 3.1's ABI
torch = { version = ">=2.10,<2.13", index = "https://download.pytorch.org/whl/cpu" }

# The torch wheel would otherwise load the system libstdc++, too old for the env
[feature.neml2.target.linux-64.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"

[feature.neml2.tasks]
build-fans_neml2 = "cmake -S . -B build-neml2 -DFANS_NEML2=ON -DFANS_ENABLE_NATIVE=ON && cmake --build build-neml2 -j"

# Compile model `model` of a NEML2 input file into the artifact FANS loads
[feature.neml2.tasks.neml2-compile]
args = ["file", "model"]
cmd  = "cd \"$INIT_CWD\" && neml2-compile {{ file }} --model {{ model }} --device cpu --dtype float64 --output-dir $(dirname {{ file }})"

[tasks]
test = { cmd = "pytest -v -s --from-pixi", cwd = "test/pytest", depends-on = ["test-fans"] }
test-fans = { cmd = "./run_tests.sh -n {{n}}", args = [
  { arg = "n", default = "2" }, # Number of threads
], cwd = "test" }

[environments]
default   = { features = ["dashboard"]}
dashboard = { features = ["dashboard"], no-default-feature = true }
dev       = { features = ["dev", "native"],  no-default-feature = true }
dev-neml2 = { features = ["dev", "neml2"],   no-default-feature = true }

################## Pixi build part ##################

[package]
name = "fans"
version = "0.8.1"
publish = true

[package.build]
backend = { name = "pixi-build-cmake", version = "*" }

[workspace.target.osx-arm64.build-variants]
cxx_compiler = ["clangxx"]

[workspace.target.linux-64.build-variants]
cxx_compiler = ["clangxx"]

[package.build-dependencies]
cmake = "*"
pkg-config = "*"
ninja = "*"

[package.host-dependencies]
hdf5 = { version = ">=1.14.6,<2", build = "mpi_openmpi_*" }
fftw = { version = "*", build = "mpi_openmpi_*" }
openmpi-mpicxx = "*"
eigen = "*"
nlohmann_json = "*"
spdlog = "*"
